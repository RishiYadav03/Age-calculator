<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100" style="background-image: url('age2.png'); background-repeat: no-repeat; background-size: cover; background-position: center center;">

  <div class="card p-4 shadow-lg rounded-4 bg-black text-white w-100 mx-3" style="max-width: 400px; background-color: rgba(0, 0, 0, 0.85);">
    <h4 class="text-center mb-3">Age Calculator</h4>
    
    <div class="mb-3">
      <label for="startDate" class="form-label">Select Date</label>
      <input id="startDate" class="form-control" type="date" />
    </div>
  
    <button class="btn btn-warning w-100">Check Age</button>
  
    <div class="mt-3 text-center">
      <p id="errMsg" class="fw-bold text-success"></p>
    </div>
  </div>

  <script src="date.js" type="module"></script>
</body>
</html>
